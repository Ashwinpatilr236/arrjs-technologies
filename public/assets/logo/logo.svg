<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#brandGrad)" />
    <!-- Tech Polygon A shape -->
    <path d="M 40 18 L 62 62 L 50 62 L 40 42 L 30 62 L 18 62 Z" fill="#ffffff" />
    <path d="M 33 48 L 47 48 L 40 33 Z" fill="url(#accentGrad)" />
    <!-- Glowing Node Dots -->
    <circle cx="40" cy="18" r="4" fill="#60a5fa" />
    <circle cx="18" cy="62" r="3.5" fill="#3b82f6" />
    <circle cx="62" cy="62" r="3.5" fill="#3b82f6" />
  </g>

  <!-- Text Mark -->
  <text x="105" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#0f172a" letter-spacing="-0.5">ARRJS</text>
  <text x="228" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#2563eb" letter-spacing="-0.5">Tech</text>
  <text x="105" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="2" text-transform="uppercase">TECHNOLOGIES</text>
</svg>
